<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan | SUYA HOST</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #e7f3ff 0%, #f8fbff 100%);
            color: #0f2f5b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            text-align: center;
            padding: 40px 20px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: #2061ff;
            margin: 0;
            line-height: 1;
        }
        .error-title {
            font-size: 2rem;
            margin: 16px 0;
            color: #0f2f5b;
        }
        .error-message {
            font-size: 1.1rem;
            color: #4b6f94;
            margin: 0 0 32px;
            line-height: 1.6;
        }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 24px;
            border-radius: 14px;
            background: #2061ff;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(32, 97, 255, 0.16);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Halaman Tidak Ditemukan</h2>
        <p class="error-message">Maaf, halaman yang Anda cari tidak ada atau telah dipindahkan. Silakan kembali ke halaman utama.</p>
        <a class="button" href="../index.html">Kembali ke Beranda</a>
    </div>
</body>
</html>
